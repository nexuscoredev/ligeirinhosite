<!DOCTYPE html>
<html lang="pt-BR" class="lig-splash-active">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>Entrar - Ligeirinho Parceiros</title>
<link rel="icon" href="img/app-icon-light-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/app-icon-light-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7D53C">
<meta name="apple-mobile-web-app-title" content="Ligeirinho Parceiros">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="img/ligeirinhologo-splash.webp" as="image" type="image/webp">
<style id="lig-splash-critical">
html,body{background:#F7D53C;margin:0}
html.lig-splash-active,html.lig-splash-active body{background:#F7D53C!important;overflow:hidden!important}
html.lig-splash-active .lig-login-main,
html.lig-splash-active .lig-login-theme,
html.lig-splash-active #login-phone-modal{visibility:hidden!important;pointer-events:none!important}
#lig-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F7D53C;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);opacity:1;transition:opacity .52s cubic-bezier(.22,1,.36,1);transform:translateZ(0);-webkit-transform:translateZ(0)}
#lig-splash.lig-splash--out{opacity:0;pointer-events:none}
.lig-splash__stage{width:min(40vw,9.5rem);height:min(40vw,9.5rem);display:flex;align-items:center;justify-content:center;will-change:transform;transform:translate3d(0,0,0) scale(.42);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.lig-splash__stage picture{display:block;width:100%;height:100%}
.lig-splash__logo{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
html.lig-splash-done .lig-login-main,html.lig-splash-done .lig-login-theme{visibility:visible;opacity:1;transition:opacity .35s ease}
@media (prefers-reduced-motion:reduce){
.lig-splash__stage{transform:none!important}
}
</style>
</head>
<body data-page="login" class="lig-login-page font-body-md antialiased">

<div id="lig-splash" class="lig-splash" role="status" aria-live="polite" aria-label="Abrindo Ligeirinho Parceiros">
<div class="lig-splash__stage">
<picture>
<source srcset="img/ligeirinhologo-splash.webp" type="image/webp">
<img class="lig-splash__logo" src="img/ligeirinhologo.png" alt="" width="256" height="256" decoding="async" fetchpriority="high">
</picture>
</div>
</div>

<script>
(function () {
  /* Se já está logado e veio de outra tela do app, não roda o splash —
     evita “voltar do nada” pro zoom do logo no meio do uso. */
  try {
    var session = JSON.parse(localStorage.getItem('ligeirinho-auth-v1') || 'null');
    var fromApp = false;
    try {
      fromApp = Boolean(document.referrer) && new URL(document.referrer).origin === location.origin;
    } catch (e) { /* ignore */ }
    if (session && session.sub && fromApp) {
      var params = new URLSearchParams(location.search);
      var next = params.get('next') || '';
      var role = String(session.role || '').toUpperCase();
      var isTotem = role === 'TOTEM' || role === 'TOTEM_DEVICE';
      var dest = isTotem ? 'totem.html' : 'inicio.html';
      if (session.mustChangePassword) {
        dest = 'conta.html#senha';
      } else if (next && next.indexOf('://') === -1 && next.indexOf('//') !== 0) {
        if (isTotem && next.indexOf('totem') === -1) dest = 'totem.html';
        else if (!isTotem && next.indexOf('totem') !== -1) dest = 'inicio.html';
        else dest = next;
      }
      location.replace(dest);
      return;
    }
  } catch (e) { /* ignore */ }

  var el = document.getElementById('lig-splash');
  var stage = el && el.querySelector('.lig-splash__stage');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var INTRO_MS = reduce ? 260 : 2700;
  var FADE_MS = reduce ? 140 : 520;
  var END_SCALE = 2.9;
  var EXIT_SCALE = 3.75;
  var done = false;
  var zoomAnim = null;
  var bootStarted = false;

  function addStylesheet(href) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    document.head.appendChild(link);
  }

  function addScript(src, attrs) {
    var s = document.createElement('script');
    s.src = src;
    if (attrs) Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
    document.head.appendChild(s);
    return s;
  }

  /* Carrega CSS/tema cedo, mas DEPOIS do 1º frame da intro — evita travar o zoom. */
  function warmShell() {
    if (bootStarted) return;
    bootStarted = true;
    addScript('js/theme.js');
    addStylesheet('css/site.css');
    addStylesheet('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
    addStylesheet('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap');
  }

  function bootApp() {
    if (window.__ligLoginBooted) return;
    window.__ligLoginBooted = true;
    warmShell();

    var cfg = document.createElement('script');
    cfg.id = 'tailwind-config';
    cfg.textContent = 'tailwind.config={theme:{extend:{colors:{"vibrant-yellow":"#F7D53C","vibrant-orange":"#F7D53C","deep-black":"#1a1a1a"},fontFamily:{"body-md":["Inter"],"headline-md":["Hanken Grotesk"]}}}}';
    document.head.appendChild(cfg);
    addScript('https://cdn.tailwindcss.com?plugins=forms,container-queries');
    addScript('https://accounts.google.com/gsi/client', { async: '', defer: '' });

    var files = [
      'js/site-config.js',
      'js/app.js',
      'js/theme-ui.js',
      'js/auth-store.js',
      'js/cart-store.js',
      'js/orders-access.js',
      'js/auth-routing.js',
      'js/auth-config-loader.js',
      'js/phone-auth.js',
      'js/layout.js',
      'js/login-mode.js',
      'js/login-hub.js',
      'js/login.js',
      'js/login-phone.js'
    ];
    var i = 0;
    function next() {
      if (i >= files.length) return;
      var s = document.createElement('script');
      s.src = files[i++];
      s.onload = next;
      s.onerror = next;
      document.body.appendChild(s);
    }
    next();
  }

  function cleanup() {
    if (el && el.parentNode) el.parentNode.removeChild(el);
    document.documentElement.classList.remove('lig-splash-active');
    document.documentElement.classList.add('lig-splash-done');
    try {
      if (window.LigeirinhoTheme && window.LigeirinhoTheme.getEffective) {
        var color = window.LigeirinhoTheme.getEffective() === 'dark' ? '#0d0d0d' : '#ffffff';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = color; });
      }
    } catch (e) { /* ignore */ }
    window.dispatchEvent(new Event('lig-splash-done'));
    bootApp();
  }

  function finish() {
    if (done) return;
    done = true;
    if (zoomAnim) {
      try { zoomAnim.cancel(); } catch (e) { /* ignore */ }
    }
    if (stage && stage.animate && !reduce) {
      var from = 'translate3d(0,0,0) scale(' + END_SCALE + ')';
      try {
        var cs = window.getComputedStyle(stage).transform;
        if (cs && cs !== 'none') from = cs;
      } catch (e) { /* ignore */ }
      stage.animate(
        [{ transform: from }, { transform: 'translate3d(0,0,0) scale(' + EXIT_SCALE + ')' }],
        { duration: FADE_MS, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
      );
    }
    el.classList.add('lig-splash--out');
    window.setTimeout(cleanup, FADE_MS + 40);
  }

  if (stage && stage.animate && !reduce) {
    zoomAnim = stage.animate(
      [
        { transform: 'translate3d(0,0,0) scale(0.42)' },
        { transform: 'translate3d(0,0,0) scale(' + END_SCALE + ')' }
      ],
      {
        duration: INTRO_MS,
        easing: 'cubic-bezier(0.22, 0.12, 0.18, 1)',
        fill: 'forwards'
      }
    );
  } else if (stage) {
    stage.style.transform = 'translate3d(0,0,0) scale(1.35)';
  }

  window.setTimeout(warmShell, 220);
  window.setTimeout(finish, INTRO_MS);
  window.setTimeout(finish, INTRO_MS + 1600);
})();
</script>

<div data-lig-theme-mount class="lig-login-theme" role="group" aria-label="Tema do app"></div>

<main class="lig-login-main">
<div class="lig-login-hero">
<div class="lig-login-logo-wrap">
<img class="lig-login-logo" src="img/ligeirinhologo.png" alt="Ligeirinho" width="440" height="440" decoding="async">
<span class="lig-login-wordmark"><span class="lig-brand__text">Ligeirinho</span><span class="lig-brand__app">Parceiros</span></span>
</div>
<h1 class="lig-login-title">Entre ou crie sua conta!</h1>
<p class="lig-login-sub" hidden></p>
</div>

<div class="lig-login-actions">

<div id="login-mode-choose" class="lig-login-mode lig-login-mode--active lig-login-choose" aria-label="Escolha como continuar">
<div class="lig-login-choose__stack">
<button type="button" id="login-go-signin" class="lig-login-choice lig-login-choice--primary">
<span class="lig-login-choice__icon" aria-hidden="true"><span class="material-symbols-outlined">login</span></span>
<span class="lig-login-choice__body">
<strong>Fazer login</strong>
<span class="lig-login-choice__hint">Entrar com Google ou CNPJ</span>
</span>
<span class="material-symbols-outlined lig-login-choice__chevron" aria-hidden="true">chevron_right</span>
</button>
<button type="button" id="login-go-signup" class="lig-login-choice lig-login-choice--secondary">
<span class="lig-login-choice__icon" aria-hidden="true"><span class="material-symbols-outlined">person_add</span></span>
<span class="lig-login-choice__body">
<strong>Cadastrar</strong>
<span class="lig-login-choice__hint">Cadastre sua empresa em poucos campos</span>
</span>
<span class="material-symbols-outlined lig-login-choice__chevron" aria-hidden="true">chevron_right</span>
</button>
</div>
</div>

<div id="login-mode-signin" class="lig-login-mode lig-login-signin" hidden aria-label="Fazer login">
<button type="button" class="lig-login-mode-back" data-login-mode="choose" aria-label="Voltar">
<span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
<span>Voltar</span>
</button>
<div class="lig-login-flow-card lig-login-flow-card--signin">
<div id="login-google-btn" class="lig-login-oauth-btn lig-login-oauth-btn--google lig-login-google-proxy" role="button" tabindex="0" aria-label="Continuar com Google">
<span class="lig-login-oauth-btn__content" aria-hidden="true">
<svg class="lig-login-google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" focusable="false">
<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
<span class="lig-login-oauth-btn__label">Continuar com Google</span>
</span>
<div id="google-signin-mount" class="lig-login-google-mount" aria-hidden="true"></div>
</div>
<div class="lig-login-divider lig-login-divider--compact" aria-hidden="true"><span>ou</span></div>
<section id="login-hub" class="lig-login-hub" aria-label="Entrar com usuário e senha">
<input id="login-hub-user" class="lig-login-setup__input lig-login-setup__input--flat" type="text" inputmode="text" autocomplete="username" placeholder="Usuário, CNPJ ou celular" aria-label="Usuário, CNPJ ou celular">
<input id="login-hub-password" class="lig-login-setup__input lig-login-setup__input--flat" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
<button type="button" id="login-hub-submit" class="lig-login-setup__save lig-login-setup__save--flat">Entrar</button>
</section>
</div>
</div>

<div id="login-mode-signup" class="lig-login-mode lig-login-signup" hidden aria-label="Cadastro">
<button type="button" class="lig-login-mode-back" data-login-mode="choose" aria-label="Voltar">
<span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
<span>Voltar</span>
</button>
<div class="lig-login-flow-card">
<form id="login-signup-form" class="lig-login-signup-form" novalidate>
<div class="lig-signup-field">
<label class="lig-signup-field__label" for="signup-company">Nome da empresa</label>
<input id="signup-company" class="lig-login-setup__input lig-login-setup__input--flat" type="text" autocomplete="organization" placeholder="Razão social ou nome fantasia" required minlength="2">
</div>
<div class="lig-signup-field">
<label class="lig-signup-field__label" for="signup-cnpj">CNPJ</label>
<input id="signup-cnpj" class="lig-login-setup__input lig-login-setup__input--flat" type="text" inputmode="numeric" autocomplete="off" placeholder="00.000.000/0000-00" maxlength="18">
</div>
<div class="lig-signup-field">
<label class="lig-signup-field__label" for="signup-phone">Telefone</label>
<input id="signup-phone" class="lig-login-setup__input lig-login-setup__input--flat" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(11) 97092-4909">
</div>
<button type="submit" id="login-phone-submit" class="lig-login-setup__save lig-login-setup__save--flat">Criar conta</button>
</form>
<p id="login-phone-status" class="lig-login-status" hidden></p>
</div>
<p class="lig-login-signup-switch">Já tem conta? <button type="button" class="lig-login-setup-link" data-login-mode="signin">Fazer login</button></p>
</div>

<p id="login-status" class="lig-login-status" hidden></p>
</div>

<p class="lig-login-legal">
Ao continuar, você concorda com nossos termos de uso e política de privacidade.
</p>
</main>

</body>
</html>
